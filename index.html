<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#062a1d" />
    <meta name="description" content="Bluff card game for friends, live on your phones" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bluff" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Bluff</title>
  </head>
  <body>
    <!-- same as components/Splash.tsx, so the intro shows before the app's code has loaded -->
    <div id="root">
      <main class="splash">
        <img class="splash-logo" src="/icon.svg" alt="" />
        <h1 class="splash-title">Bluff</h1>
        <p class="splash-tag">Lie with a straight face. Catch your friends.</p>
        <div class="splash-loader" aria-hidden="true"><i></i><i></i><i></i></div>
        <p class="splash-status">Shuffling the deck…</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
